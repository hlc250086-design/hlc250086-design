<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 2.5 Ultra - Next Gen AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Google Sans', 'Inter', sans-serif;
      background-color: #131314;
      color: #e3e3e3;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #1e1f20;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      border-right: 1px solid #2d2f31;
    }
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1c;
      border: 1px solid #3c4043;
      color: #e3e3e3;
      padding: 12px 16px;
      border-radius: 28px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: #282a2d;
      border-color: #5f6368;
    }
    .recent-title {
      font-size: 12px;
      color: #8e918f;
      font-weight: 600;
      padding-left: 8px;
    }
    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }
    .history-item {
      padding: 10px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #c4c7c5;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }
    .history-item:hover {
      background: #282a2d;
      color: #fff;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
    }
    .model-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e1f20;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 15px;
      color: #a8c7fa;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c4dff, #18ffff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
    }

    /* Welcome Container */
    .chat-container {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 24px 100px;
    }
    .greeting {
      font-size: 52px;
      font-weight: 500;
      background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .sub-greeting {
      font-size: 48px;
      font-weight: 500;
      color: #444746;
      margin-bottom: 40px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .card {
      background: #1e1f20;
      padding: 16px;
      border-radius: 16px;
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .card:hover {
      background: #282a2d;
      transform: translateY(-2px);
    }
    .card p {
      font-size: 14px;
      color: #e3e3e3;
      line-height: 1.4;
    }
    .card-icon {
      align-self: flex-end;
      background: #131314;
      padding: 8px;
      border-radius: 50%;
      font-size: 16px;
    }

    /* Input Box */
    .input-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 820px;
      padding: 0 24px;
    }
    .input-box {
      background: #1e1f20;
      border-radius: 28px;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #3c4043;
    }
    .input-box textarea {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      height: 48px;
    }
    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .action-btns {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #c4c7c5;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover {
      background: #282a2d;
      color: #fff;
    }
    .send-btn {
      background: #a8c7fa;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #040e25;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .send-btn:hover {
      opacity: 0.85;
    }

    /* Prank Overlay */
    .prank-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090a0f;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .reasoning-box {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }
    .reasoning-text {
      font-size: 20px;
      color: #a8c7fa;
      font-weight: 500;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e1f20;
      border-top: 4px solid #a8c7fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
